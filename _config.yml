# Configuração do build do GitHub Pages (Jekyll).
#
# `exclude` lista arquivos que ficam no repositório mas NÃO são copiados para o
# site publicado. O admin.html precisa estar versionado — é como o parceiro
# clona e edita o painel — mas não deve responder em
# https://pabloholiveira.github.io/Avaliacoes-Teste-com-mudanca-no-QR-Code/admin.html, senão qualquer um que
# descubra o endereço abre o gerador no navegador.
#
# Isto não é segredo: o repositório é público, então o código do painel continua
# legível em github.com. O que a exclusão evita é o painel ficar *funcionando*
# como página no ar. Se um dia o parceiro precisar abrir o painel pela URL em
# vez de rodar local, apague a linha do admin.html abaixo.
exclude:
  - admin.html
  - PUBLICAR.md
  - gerar_qrcode.py
